name: Proxy.py Brew

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}-latest
    name: Brew - Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      matrix:
        os: [macOS]
        python: ['3.9']
      max-parallel: 1
      fail-fast: false
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Brew
        run: |
          brew tap-new --no-git local/proxy
          cp helper/homebrew/develop/proxy.rb "$(brew --repository)/Library/Taps/local/homebrew-proxy/Formula/"
          brew install local/proxy/proxy
      - name: Verify
        run: |
          proxy -h
