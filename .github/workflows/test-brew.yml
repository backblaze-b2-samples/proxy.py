name: Proxy.py Brew

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}-latest
    name: Brew - Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      matrix:
        os: [macOS]
        python: ['3.9']
      max-parallel: 1
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Brew
        run: |
          brew tap-new --no-git local/proxy
          cp helper/homebrew/develop/proxy.rb "$(brew --repository)/Library/Taps/local/homebrew-proxy/Formula/"
          brew install local/proxy/proxy
      - name: Verify
        run: |
          proxy -h
